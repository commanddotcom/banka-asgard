# Тимчасовий конфіг для ПЕРШОГО розгортання, поки ще немає SSL-сертифіката.
# Копіюється на сервер у /var/www/moblik/docker/nginx/conf.d/donate.conf
# ПЕРЕД отриманням сертифіката (потрібен лише для проходження ACME HTTP-01
# challenge). Після успішного certbot certonly — замінити на donate.conf.

server {
    listen 80;
    server_name donate.asgard.dtrmnd.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/public;
        allow all;
    }

    location / {
        return 404;
    }
}
