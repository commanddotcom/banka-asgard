<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="8">
<title>Технічні роботи — Банка</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .box {
    text-align: center;
    padding: 2.5rem 2rem;
    max-width: 26rem;
  }
  .spinner {
    width: 2.25rem;
    height: 2.25rem;
    margin: 0 auto 1.25rem;
    border-radius: 50%;
    border: 3px solid rgba(226, 232, 240, 0.25);
    border-top-color: #e2e8f0;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
  p { margin: 0; color: #94a3b8; line-height: 1.5; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Сайт оновлюється</h1>
    <p>Зачекайте хвилину, будь ласка — зараз тривають технічні роботи.
    Сторінка оновиться автоматично.</p>
  </div>
</body>
</html>
