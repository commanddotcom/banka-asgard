# Конфігурація для banka (donate.asgard.dtrmnd.agency)
# Копіюється на сервер у /var/www/moblik/docker/nginx/conf.d/donate.conf
# Проксує на контейнер app з banka_lara, опублікований на хості як 172.17.0.1:8082
#
# УВАГА: при першому розгортанні сертифікатів ще не існує — спочатку викласти
# лише HTTP-блок (без секції "listen 443 ssl"), отримати сертифікат через
# certbot --webroot, і лише тоді додати HTTPS-блок нижче. Див. DEPLOY.md.

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name donate.asgard.dtrmnd.agency;

    location /.well-known/acme-challenge/ {
        root /var/www/public;
        allow all;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name donate.asgard.dtrmnd.agency;

    ssl_certificate /etc/nginx/ssl/donate.asgard.dtrmnd.agency/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/donate.asgard.dtrmnd.agency/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    error_log  /var/log/nginx/donate_error.log;
    access_log /var/log/nginx/donate_access.log;

    location / {
        resolver 127.0.0.11 valid=30s;
        set $upstream 172.17.0.1:8082;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
